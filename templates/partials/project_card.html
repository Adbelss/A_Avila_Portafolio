<article class="custom-card h-100">
    <div class="card-body-custom">
        <span class="custom-badge">Proyecto</span>

        <h3 class="h4 mt-3">{{ project.title|default:"Nombre del proyecto" }}</h3>

        <p class="text-secondary-custom mb-4">
            {{ project.summary|default:"Resumen breve del proyecto, objetivo principal y valor aportado." }}
        </p>

        <div class="d-flex flex-wrap gap-2 mb-4">
            <span class="tech-badge">Django</span>
            <span class="tech-badge">Bootstrap</span>
            <span class="tech-badge">MySQL</span>
        </div>

        <a href="#" class="card-link-custom">
            Ver detalle
        </a>
    </div>
</article>
