{% if messages %}
<section class="py-3">
    <div class="container">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar alerta"></button>
            </div>
        {% endfor %}
    </div>
</section>
{% endif %}
